# RF Pi offline voice translator (hampi-translate). See TRANSLATOR.md.
# Your callsign comes from /etc/hampi/station.conf.
# After editing:  hampi-translate check
# Keep comments on their own lines: the hampi-whisper service also reads this
# file, and systemd does not strip a trailing "# comment" from a value.
# After changing WHISPER_MODEL or WHISPER_THREADS: sudo systemctl restart hampi-whisper

# --- Languages (two-letter codes; each needs an Argos pack both ways + a voice) ---
MY_LANG=en
THEIR_LANG=it

# --- Speech to text (whisper.cpp) ---
# server = hampi-whisper service keeps the model loaded (faster); cli = load per transmission
STT=server
WHISPER_URL=http://127.0.0.1:8178
WHISPER_CLI=/usr/local/bin/whisper-cli
WHISPER_MODEL=/opt/hampi/translate/models/ggml-base-q5_1.bin
WHISPER_THREADS=4

# --- Translation (Argos Translate language packs, run on CTranslate2) ---
ARGOS_DIR=/opt/hampi/translate/argos
# 1 = fastest, 4 = Argos default; 2 is a good Pi 4 balance
TRANSLATE_BEAM=2

# --- Text to speech (Piper): one voice per language, VOICE_<LANG> ---
PIPER=/opt/hampi/translate/venv/bin/piper
VOICE_EN=/opt/hampi/translate/voices/en_US-ljspeech-medium.onnx
VOICE_IT=/opt/hampi/translate/voices/it_IT-riccardo-x_low.onnx
# Japanese uses Open JTalk (Piper has no Japanese voice), set by the installer:
#   VOICE_JA=openjtalk:/usr/share/hts-voice/nitech-jp-atr503-m001/nitech_jp_atr503_m001.htsvoice
OPENJTALK_DIC=/var/lib/mecab/dic/open-jtalk/naist-jdic

# --- Audio devices: 'default', an index, or part of the name (hampi-translate devices) ---
OPERATOR_IN=default
OPERATOR_OUT=default
RADIO_IN=USB Audio
RADIO_OUT=USB Audio
# TX audio level into the rig, 0-1. Set it like any digital mode: no ALC action.
RADIO_GAIN=0.8

# --- Radio PTT: rigctld | rts | dtr | gpio | vox | none ---
PTT=rigctld
RIGCTLD=127.0.0.1:4532
PTT_SERIAL=/dev/ttyUSB0
PTT_GPIO=17
PTT_LEAD_MS=300
PTT_TAIL_MS=200
MAX_TX_SEC=90

# --- Local PTT (you -> the Pi): keyboard (Enter toggles) | gpio (footswitch to GND, hold to talk) ---
LOCAL_PTT=keyboard
LOCAL_PTT_GPIO=27
# Optional second button that sends your station ID / ends the contact
ID_GPIO=
MAX_RECORD_SEC=45

# --- Operating ---
# Show the translation and wait for a confirming press before keying (recommended)
REVIEW=1
REVIEW_TIMEOUT=20
# Say "machine-translated transmission" in their language first
DISCLOSE=1
# FCC 97.119: English ID at the end of a contact and at least every 10 minutes
ID_EVERY_MIN=10
# Optional WAV of your own voice giving your call (otherwise Piper says it in English)
ID_WAV=
# Translate incoming audio to your headphones
RX=1
# Blank = THEIR_LANG; 'auto' lets Whisper detect it (slower, less reliable on noisy audio)
RX_LANG=
RX_THRESHOLD_DB=-38
RX_HANG_MS=900
RX_MIN_MS=700
GLOSSARY=/etc/hampi/translate-glossary.txt
STATUS_FILE=/var/lib/hampi/translate-status.json
